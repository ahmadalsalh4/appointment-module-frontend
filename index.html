<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Randevu Sistemi</title>
    <!--
      Theme application moved to /public/theme-init.js so the strict CSP
      (`script-src 'self'`) in netlify.toml permits it. `defer` keeps
      parsing non-blocking; the script still runs before React paints.
    -->
    <script src="/theme-init.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Bu uygulamayı görüntülemek için JavaScript etkin olmalıdır. Lütfen
      tarayıcı ayarlarınızdan JavaScript'i etkinleştirin.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
